<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDAX</title>
<meta name="theme-color" content="#17332C">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS: pantalla completa e ícono -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REDAX">
<link rel="apple-touch-icon" href="apple-touch-180.png">
<link rel="icon" href="favicon-32.png">
<style>
  :root{--ink:#17332C;--ink2:#12271f;--paper:#F3F2EA;--redax:#5B57C7;--green:#2E8C69;--soft:#9FC2B2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--ink2);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;color:#EAF1ED;overflow:hidden;}
  #app{position:fixed;inset:0;border:0;width:100%;height:100%;background:var(--paper);}
  /* Pantalla de bienvenida / pegar llave */
  .welcome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;
    background:radial-gradient(120% 80% at 50% 0%,#1d4438,#12271f);}
  .logo{width:96px;height:96px;margin-bottom:20px;}
  .welcome h1{font-size:26px;font-weight:600;letter-spacing:.02em;}
  .welcome .marca{color:var(--redax);}
  .welcome p{font-size:14px;color:#A7C1B6;margin-top:10px;max-width:320px;line-height:1.5;}
  .welcome input{margin-top:22px;width:100%;max-width:340px;padding:14px;border-radius:12px;border:1.5px solid #2f5347;background:#0e1f19;color:#EAF1ED;font-size:15px;text-align:center;letter-spacing:.02em;}
  .welcome button{margin-top:12px;width:100%;max-width:340px;padding:14px;border-radius:12px;border:0;background:var(--redax);color:#fff;font-size:15px;font-weight:600;}
  .welcome .err{color:#f2a9b6;font-size:13px;margin-top:12px;min-height:16px;}
  .welcome .hint{color:#7f9a8e;font-size:12px;margin-top:14px;max-width:320px;line-height:1.5;}
  .welcome .link{margin-top:16px;background:none;border:0;color:#8fb6a6;font-size:13px;text-decoration:underline;width:auto;padding:6px;}
  .spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink2);color:#A7C1B6;font-size:14px;}
  /* Botón flotante "cambiar llave" sobre la app */
  #salir{position:fixed;z-index:9;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(18,39,31,.82);color:#EAF1ED;border:1px solid rgba(159,194,178,.35);
    border-radius:22px;padding:8px 14px;font-size:12.5px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.28);backdrop-filter:blur(6px);cursor:pointer;}
  #salir svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px;stroke:#9FC2B2;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<!--
  ==========================================================================
  REDAX · PWA (cascarón)  ·  Colegio Bertha Von Glumer «Arcoíris»
  --------------------------------------------------------------------------
  1) Pon aquí abajo tu URL /exec de la app de Apps Script (la de url_webapp).
  ==========================================================================
-->
<script>
  var APPS_URL = "https://script.google.com/macros/s/AKfycbzIplreJsM6ZFwrWKXqVjl49PpEMKwYRuwLW4Cp_55zvtYBpSK4-sGmtNZB6tQ0sCSh/exec";
</script>

<div id="root"></div>

<script>
(function(){
  var root = document.getElementById('root');
  var params = new URLSearchParams(location.search);

  // Logo REDAX (planeta índigo con bandas) dibujado en el propio HTML (nunca se rompe)
  var LOGO =
    '<svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="REDAX">'+
    '<defs>'+
    '<radialGradient id="rx" cx="38%" cy="30%" r="72%">'+
    '<stop offset="0%" stop-color="#9490EE"/><stop offset="45%" stop-color="#5B57C7"/><stop offset="100%" stop-color="#332F82"/>'+
    '</radialGradient>'+
    '<radialGradient id="rspec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity=".7"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
    '<clipPath id="rb"><circle cx="60" cy="60" r="30"/></clipPath>'+
    '</defs>'+
    '<rect x="4" y="4" width="112" height="112" rx="30" fill="#12271f"/>'+
    '<circle cx="60" cy="60" r="30" fill="url(#rx)"/>'+
    '<g clip-path="url(#rb)" opacity=".6"><g transform="rotate(-12 60 60)">'+
    '<rect x="26" y="53" width="68" height="4"   rx="2" fill="#3a3690"/>'+
    '<rect x="26" y="61" width="68" height="2.5" rx="1.2" fill="#7d79df"/>'+
    '<rect x="26" y="67" width="68" height="4.5" rx="2" fill="#332f82"/>'+
    '</g></g>'+
    '<ellipse cx="51" cy="50" rx="14" ry="9" fill="url(#rspec)"/>'+
    '</svg>';

  // token: de la liga (?t=) o del que guardamos la vez pasada
  var tk = params.get('t');
  if (tk) { try { localStorage.setItem('redax_token', tk); } catch(e){} }
  if (!tk) { try { tk = localStorage.getItem('redax_token') || ''; } catch(e){} }

  function launch(token){
    root.innerHTML =
      '<iframe id="app" src="'+APPS_URL+'?a=inicio&t='+encodeURIComponent(token)+'" allow="clipboard-write; fullscreen"></iframe>'+
      '<button id="salir"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5M5 12h12"/></svg>Cambiar llave</button>';
    document.getElementById('salir').onclick = function(){
      try { localStorage.removeItem('redax_token'); } catch(e){}
      welcome('Pega la nueva llave para entrar.');
    };
  }

  // Saca la llave de lo que sea que peguen: link completo, ?t=..., o la pura llave
  function extraerLlave(v){
    v = (v||'').trim();
    if(!v) return '';
    var m = v.match(/[?&]t=([^&\s]+)/);      // trae un link con ?t= o &t=
    if(m) return decodeURIComponent(m[1]);
    if(/^https?:\/\//i.test(v)) return '';   // es un link pero SIN llave
    return decodeURIComponent(v);            // pegaron solo la llave
  }

  function welcome(msg){
    root.innerHTML =
      '<div class="welcome">'+
      LOGO+
      '<h1>LUMEN <span class="marca">REDAX</span></h1>'+
      '<p>Pega aquí tu <b>llave de acceso</b> (te la compartieron por correo o mensaje).</p>'+
      '<input id="liga" type="text" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="tu llave…" autocomplete="off">'+
      '<button id="go">Entrar</button>'+
      '<div class="err" id="err">'+(msg||'')+'</div>'+
      '<div class="hint">Solo la primera vez. Después REDAX recuerda tu llave y entra directo.</div>'+
      '</div>';
    function entrar(){
      var v = document.getElementById('liga').value || '';
      var token = extraerLlave(v);
      if(!token){ document.getElementById('err').textContent = 'No reconocí la llave. Pégala de nuevo (o el link completo).'; return; }
      try { localStorage.setItem('redax_token', token); } catch(e){}
      launch(token);
    }
    document.getElementById('go').onclick = entrar;
    document.getElementById('liga').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
  }

  if (APPS_URL.indexOf('PON_AQUI') === 0) {
    root.innerHTML = '<div class="spinner">Falta configurar APPS_URL en index.html</div>';
  } else if (tk) {
    launch(tk);
  } else {
    welcome('');
  }

  // Service worker (para que sea instalable y abra offline el cascarón)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
